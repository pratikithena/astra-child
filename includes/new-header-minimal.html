<!-- ITHENA header (widget-ready). Paste into an Elementor HTML widget. Needs Noto Sans loaded site-wide. -->
<script>
/* theme pre-init: saved/system theme before paint, exposes window.ithenaTheme */
(function () {
    var KEY = 'ithena-theme', root = document.documentElement;
    var t = window.ithenaTheme = {
        get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },   /* used by service pages */
        isDark: function () { return root.classList.contains('dark'); },
        apply: function (isDark) {
            root.classList.toggle('dark', isDark);
            try { localStorage.setItem(KEY, isDark ? 'dark' : 'light'); } catch (e) {}
            t.sync();
        },
        toggle: function () { t.apply(!t.isDark()); },
        /* mirrors the theme onto the switch and #main-section; never changes it */
        sync: function () {
            var isDark = t.isDark(), btn = document.getElementById('ih-theme'), main = document.getElementById('main-section');
            if (btn) { btn.setAttribute('aria-checked', isDark); btn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme'); }
            if (main) main.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }
    };
    var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) root.classList.add('dark');
})();
</script>

<style>

/* ===== panel: tabs | offerings | CTA, brand dividers between, no section bg ===== */
.ih-mm{position:absolute;left:50%;top:100%;margin-top:8px;width:min(1220px,calc(100% - 32px));background:var(--ih-panel);border:1px solid var(--ih-line);border-radius:24px;box-shadow:var(--ih-shadow);opacity:0;transform:translate(-50%,-8px);transition:opacity .22s,transform .28s var(--ih-ease)}

.ih-ptabs{display:flex;flex-direction:column;gap:2px;padding:12px 16px 12px 4px}

/* offerings: panes share one grid cell so the panel height never jumps */
.ih-ppanes{display:grid;padding:16px 24px}

.ih-drawer.is-on .ih-dnav>*,.ih-dh[aria-expanded="true"]+.ih-db>*{animation:ih-in .4s var(--ih-ease) backwards;animation-delay:calc(60ms + var(--i,0) * 40ms)}

@media (max-width:980px){

@media (prefers-reduced-motion:reduce){
    .ih-root *,.ih-root *::before,.ih-root *::after{transition-duration:.01ms!important;animation:none!important}
}

        cloud: 'M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9z', bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
        shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
        wrench: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.7 2.7-2-2z'
    };
    var ICON_FOR = {
        'Solutions': 'layers', 'Services': 'compass', 'Industries': 'factory', 'Case Studies': 'chart', 'Company': 'building',
        'OEM | Distributors': 'wrench', 'Manufacturer': 'factory', 'Enterprise': 'building',
        'Advisory Consulting': 'compass', 'Data Management': 'db', 'Cloud Modernization': 'cloud', 'Business Transformation': 'users', 'Manufacturing Integration': 'bolt',
        'OEM': 'wrench', 'Manufacturing': 'factory', 'Strategic Industries': 'shield'
    };
    function icon(title, cls) { return svg(P[ICON_FOR[title] || 'cube'], cls); }
    var CHEV = svg('M6 9l6 6 6-6', 'ih-ch'), ARR = 'M5 12h14M13 6l6 6-6 6';

    /* ---- builders ---- */
    var hasKids = function (x) { return x.c && x.c.length; };
    var isFlat = function (node) { return !node.c.some(hasKids); };   /* leaf children only: no tabs */
    var st = function (i) { return ' style="--i:' + i + '"'; };       /* stagger index for the entry animation */

    function items(list) {
        return list.map(function (l, i) {
            return '<a class="ih-a ih-it" href="' + l.u + '"' + st(i) + '><span class="ih-it-t">' + l.t + '</span>' + (l.d ? '<span class="ih-it-d">' + l.d + '</span>' : '') + svg(ARR, 'ih-go') + '</a>';
        }).join('');
    }
    function offerings(col) {
        return col.c.some(hasKids)
            ? '<div class="ih-stgs" style="--n:' + Math.min(col.c.length, 3) + '">' + col.c.map(function (g, i) { return '<div class="ih-stg"' + st(i) + '><div class="ih-stg-t">' + g.t + '</div><div class="ih-its">' + items(g.c) + '</div></div>'; }).join('') + '</div>'
            : '<div class="ih-flow">' + items(col.c) + '</div>';
    }
    function panel(node, k) {
        var mid = isFlat(node)
            ? '<div class="ih-ppanes"><div class="ih-pp is-on">' + offerings(node) + '</div></div>'
            : '<div class="ih-ptabs" role="tablist" aria-label="' + node.t + '">' + node.c.map(function (col, i) {
                  return '<button type="button" class="ih-b ih-ptab' + (i ? '' : ' is-on') + '" role="tab" aria-selected="' + !i + '" data-p="' + i + '"' + st(i) + '>' +
                      icon(col.t, 'ih-tab-ic') + '<span class="ih-ptab-t">' + col.t + '</span><span class="ih-ptab-d">' + col.d + '</span>' + svg(ARR, 'ih-ar') + '</button>';
              }).join('') + '</div>' +
              '<div class="ih-ppanes">' + node.c.map(function (col, i) { return '<div class="ih-pp' + (i ? '' : ' is-on') + '" role="tabpanel" data-p="' + i + '">' + offerings(col) + '</div>'; }).join('') + '</div>';
        var spot = '<div class="ih-spot"><span class="ih-kick"' + st(1) + '>' + node.t + '</span><div class="ih-spot-t"' + st(2) + '>' + (SPOT[node.t] || '') + '</div>' +
            '<a href="/contact/" class="ih-a ih-btn"' + st(3) + '>Contact Us ' + svg(ARR) + '</a></div>';
        return '<div class="ih-mm" id="ih-mm-' + k + '" hidden><div class="ih-mp' + (isFlat(node) ? ' ih-flat' : '') + '">' + mid + spot + '</div></div>';
    }
    function desktop(node, k) {
        if (!hasKids(node)) return '<li class="ih-ni"><a class="ih-a ih-nl" href="' + node.u + '">' + icon(node.t, 'ih-ni-ic') + node.t + '</a></li>';
        return '<li class="ih-ni ih-has"><button type="button" class="ih-b ih-nl" aria-expanded="false" aria-controls="ih-mm-' + k + '">' + icon(node.t, 'ih-ni-ic') + node.t + CHEV + '</button>' + panel(node, k) + '</li>';
    }
    function dItems(list) { return list.map(function (l, i) { return '<a class="ih-a ih-dit" href="' + l.u + '"' + st(i) + '>' + l.t + '</a>'; }).join(''); }
    function dAcc(label, body, cls, i) {
        return '<div class="ih-dacc' + (cls || '') + '"' + st(i) + '><button type="button" class="ih-b ih-dh" aria-expanded="false">' + label + CHEV + '</button><div class="ih-db">' + body + '</div></div>';
    }
    function mobile(node, k) {
        if (!hasKids(node)) return '<a class="ih-a ih-dflat" href="' + node.u + '"' + st(k) + '>' + node.t + '</a>';
        var body = isFlat(node) ? dItems(node.c) : node.c.map(function (col, ci) {
            var inner = col.c.some(hasKids)
                ? col.c.map(function (g) { return '<div class="ih-dstage">' + g.t + '</div>' + dItems(g.c); }).join('')
                : dItems(col.c);
            return dAcc('<span class="ih-dh-t">' + col.t + (col.d ? '<span class="ih-dh-d">' + col.d + '</span>' : '') + '</span>', inner, ' ih-dsub', ci);
        }).join('');
        return dAcc(node.t, body, '', k);
    }
    root.querySelector('#ih-menu').innerHTML = MENU.map(desktop).join('');
    root.querySelector('#ih-dnav').innerHTML = MENU.map(mobile).join('');

    /* ---- mega panel: hover intent, click, Escape, focus leaving ---- */
    var bar = root.querySelector('.ih-bar');
    var tops = [].slice.call(root.querySelectorAll('.ih-has'));
    var openItem = null, openT = null, closeT = null;
    var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
    function show(ni) {
        if (openItem === ni) return;
        hide();
        ni.querySelector('.ih-mm').hidden = false;
        requestAnimationFrame(function () { requestAnimationFrame(function () { ni.classList.add('is-open'); }); });   /* two frames so the transition runs */
        ni.querySelector('.ih-nl').setAttribute('aria-expanded', 'true');
        openItem = ni;
    }
    function hide() {
        if (!openItem) return;
        var ni = openItem, mm = ni.querySelector('.ih-mm');
        ni.classList.remove('is-open');
        ni.querySelector('.ih-nl').setAttribute('aria-expanded', 'false');
        setTimeout(function () { if (!ni.classList.contains('is-open')) mm.hidden = true; }, 230);
        openItem = null;
    }
    function cancel() { clearTimeout(openT); clearTimeout(closeT); }
    tops.forEach(function (ni) {
        ni.querySelector('.ih-nl').addEventListener('click', function () { cancel(); openItem === ni ? hide() : show(ni); });
        if (fine) {
            ni.addEventListener('mouseenter', function () { cancel(); openT = setTimeout(function () { show(ni); }, openItem ? 0 : 90); });
            ni.addEventListener('mouseleave', function () { cancel(); closeT = setTimeout(hide, 160); });
        }
    });
    document.addEventListener('click', function (e) { if (openItem && !openItem.contains(e.target)) hide(); });
    document.addEventListener('focusin', function (e) { if (openItem && !openItem.contains(e.target)) hide(); });
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (openItem) { var nl = openItem.querySelector('.ih-nl'); hide(); nl.focus(); }
        if (drawer.classList.contains('is-on')) closeDrawer();
    });

    /* ---- section tabs: hover on fine pointers, click/focus/arrow keys everywhere ---- */
    root.querySelectorAll('.ih-ptabs').forEach(function (tl) {
        var tabs = [].slice.call(tl.querySelectorAll('.ih-ptab'));
        var panes = tl.parentNode.querySelectorAll('.ih-pp');
        function pick(t) {
            tabs.forEach(function (x) { var on = x === t; x.classList.toggle('is-on', on); x.setAttribute('aria-selected', on); });
            panes.forEach(function (p) { p.classList.toggle('is-on', p.dataset.p === t.dataset.p); });
        }
        tabs.forEach(function (t, i) {
            t.addEventListener('click', function () { pick(t); });
            t.addEventListener('focus', function () { pick(t); });
            if (fine) t.addEventListener('mouseenter', function () { pick(t); });
            t.addEventListener('keydown', function (e) {
                var n = e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowUp' ? i - 1 : -1;
                if (n >= 0 && n < tabs.length) { e.preventDefault(); tabs[n].focus(); }
            });
        });
    });

    /* ---- drawer ---- */
    var burger = root.querySelector('.ih-burger'), drawer = root.querySelector('.ih-drawer'), veil = root.querySelector('.ih-veil'), lastFocus = null;
    function openDrawer() {
        lastFocus = document.activeElement;
        drawer.hidden = veil.hidden = false;
        requestAnimationFrame(function () { requestAnimationFrame(function () { drawer.classList.add('is-on'); veil.classList.add('is-on'); }); });
        burger.setAttribute('aria-expanded', 'true');
        document.documentElement.style.overflow = 'hidden';
        drawer.querySelector('.ih-dx').focus();
    }
    function closeDrawer() {
        drawer.classList.remove('is-on'); veil.classList.remove('is-on');
        burger.setAttribute('aria-expanded', 'false');
        document.documentElement.style.overflow = '';
        setTimeout(function () { drawer.hidden = veil.hidden = true; }, 320);
        if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    burger.addEventListener('click', openDrawer);
    root.querySelectorAll('[data-ih-close]').forEach(function (b) { b.addEventListener('click', closeDrawer); });
    drawer.querySelectorAll('.ih-a').forEach(function (a) { a.addEventListener('click', closeDrawer); });
    drawer.querySelectorAll('.ih-dh').forEach(function (h) {
        h.addEventListener('click', function () {
            var on = h.getAttribute('aria-expanded') === 'true';
            [].forEach.call(h.parentNode.parentNode.children, function (s) {   /* one open per level */
                var b = s.querySelector && s.querySelector(':scope > .ih-dh'); if (b) b.setAttribute('aria-expanded', 'false');
            });
            h.setAttribute('aria-expanded', on ? 'false' : 'true');
        });
    });
    drawer.addEventListener('keydown', function (e) {   /* focus trap */
        if (e.key !== 'Tab') return;
        var f = [].slice.call(drawer.querySelectorAll('.ih-a,.ih-b')).filter(function (x) { return x.offsetParent; });
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    addEventListener('resize', function () { if (innerWidth > 980 && drawer.classList.contains('is-on')) closeDrawer(); });

    /* ---- scroll state + theme switch ---- */
    function onScroll() { bar.classList.toggle('is-scrolled', scrollY > 8); }
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    ithenaTheme.sync();
    root.querySelector('#ih-theme').addEventListener('click', ithenaTheme.toggle);
})();
</script>
